syntax = "proto3";

option csharp_namespace = "LovgaCommon";

package broker.subscriber;

service Subscriber {
  rpc SubscribeStream (stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  oneof payload {
    SubscribeAction subscribe = 1;
    UnsubscribeAction unsubscribe = 2;
    AcknowledgeAction ack = 3;
  }
}

message SubscribeAction {
  string topic = 1;
  string consumer_id = 2;
}

message UnsubscribeAction {
  string topic = 1;
  string consumer_id = 2;
}

message AcknowledgeAction {
  int32 message_id = 1;
  string topic = 2;
}

message ServerMessage {
  int32 message_id = 1;
  string topic = 2;
  string content = 3;
}